<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زيت زيتون — المتجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241d12;
    --olive-deep:#2c3620;
    --olive:#4a5a30;
    --olive-soft:#6b7c47;
    --gold:#c2963a;
    --gold-light:#e6c877;
    --paper:#efe9d6;
    --paper-card:#e2dabd;
    --paper-deep:#dcd2ae;
    --line: rgba(44,54,32,.18);
    --danger:#a4402c;
    --whatsapp:#3a8f5f;
    --radius: 22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    line-height:1.6;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Rakkas',serif;
    font-weight:400;
    color:var(--olive-deep);
    letter-spacing:.3px;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:'Cairo',sans-serif;cursor:pointer;border:none;}
  input,select,textarea{font-family:'Cairo',sans-serif;}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px;}

  /* HEADER */
  .site-header{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg, rgba(239,233,214,.97), rgba(239,233,214,.9));
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .header-row{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;max-width:960px;margin:0 auto;}
  .brand-badge{display:flex;align-items:center;gap:12px;}
  .badge-circle{
    width:54px;height:54px;border-radius:50%;
    background:#fbf9f1;
    display:flex;align-items:center;justify-content:center;
    box-shadow: inset 0 0 0 2px rgba(44,54,32,.12), 0 3px 8px rgba(44,54,32,.2);
    flex-shrink:0;overflow:hidden;
  }
  .badge-circle img{width:100%;height:100%;object-fit:contain;padding:4px;}
  .badge-circle span{font-family:'Rakkas',serif;color:var(--olive-deep);font-size:20px;}
  .brand-name{font-family:'Rakkas',serif;font-size:22px;color:var(--olive-deep);}
  .brand-tagline{font-size:11px;color:var(--olive-soft);margin-top:-2px;}
  .cart-btn{
    background:var(--olive-deep);color:var(--paper);
    border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;
    display:flex;align-items:center;gap:8px;position:relative;
  }
  .cart-count{
    background:var(--gold);color:var(--ink);border-radius:50%;
    width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800;
  }

  /* HERO */
  .hero{padding:52px 20px 26px;text-align:center;}
  .hero .eyebrow{color:var(--gold);font-weight:700;letter-spacing:2px;font-size:13px;text-transform:uppercase;}
  .hero h1{font-size:42px;margin:10px 0 14px;line-height:1.35;}
  .hero p{max-width:520px;margin:0 auto;color:#4a4232;font-size:16px;}

  /* SIGNATURE BOTTLE VISUAL */
  .stage{display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 20px 6px;}
  .bottle-wrap{position:relative;width:230px;height:320px;display:flex;align-items:center;justify-content:center;}
  .bottle-photo{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:3;
    filter:drop-shadow(0 16px 22px rgba(44,54,32,.28));
  }
  .bottle-svg{width:100%;height:100%;position:relative;z-index:2;}
  .fill-mask{transition:height 1.1s cubic-bezier(.16,.9,.28,1), y 1.1s cubic-bezier(.16,.9,.28,1);}
  .liter-badge{
    background:var(--olive-deep);color:var(--gold-light);
    padding:6px 18px;border-radius:999px;font-size:13.5px;font-weight:700;letter-spacing:.5px;
  }

  /* SIZE SELECTOR */
  .size-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:6px 20px 8px;}
  .size-pill{
    background:var(--paper-card);border:1.5px solid transparent;border-radius:16px;
    padding:10px 14px;min-width:96px;text-align:center;transition:.18s;
  }
  .size-pill .l{display:block;font-weight:800;font-size:16px;color:var(--olive-deep);}
  .size-pill .p{display:block;font-size:12px;color:#5a5340;margin-top:2px;}
  .size-pill .p .was{text-decoration:line-through;opacity:.6;margin-left:4px;}
  .size-pill.active{background:var(--olive-deep);border-color:var(--gold);}
  .size-pill.active .l,.size-pill.active .p{color:var(--gold-light);}

  .price-block{text-align:center;padding:8px 20px 26px;}
  .price-row{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap;}
  .price-block .amount{font-size:34px;font-weight:800;color:var(--olive-deep);}
  .price-block .amount span{font-size:16px;font-weight:600;color:var(--olive-soft);}
  .price-was{font-size:17px;text-decoration:line-through;color:#9a917a;}
  .discount-badge{background:var(--gold);color:var(--ink);font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;}
  .cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .btn{border-radius:14px;padding:14px 26px;font-weight:700;font-size:15px;transition:.15s;}
  .btn-gold{background:linear-gradient(180deg,var(--gold-light),var(--gold));color:var(--ink);}
  .btn-gold:hover{filter:brightness(1.05);}
  .btn-outline{background:transparent;border:2px solid var(--olive-deep);color:var(--olive-deep);}
  .btn-outline:hover{background:var(--olive-deep);color:var(--paper);}

  /* INFO */
  .section{padding:36px 20px;}
  .divider{width:60px;height:3px;background:var(--gold);border-radius:3px;margin:0 auto 18px;}
  .section-title{text-align:center;font-size:26px;margin:0 0 18px;}
  .facts{display:flex;justify-content:center;gap:26px;margin:20px auto 0;flex-wrap:wrap;max-width:640px;}
  .fact{text-align:center;}
  .fact b{display:block;font-family:'Rakkas',serif;font-size:20px;color:var(--olive-deep);}
  .fact span{font-size:12px;color:var(--olive-soft);}

  /* DESCRIPTION ACCORDION */
  .desc-blocks{max-width:640px;margin:24px auto 0;display:flex;flex-direction:column;gap:12px;}
  .desc-block{background:var(--paper-card);border-radius:16px;overflow:hidden;}
  .desc-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;cursor:pointer;}
  .desc-head h3{margin:0;font-size:18px;}
  .desc-chevron{font-size:16px;color:var(--olive-deep);transition:transform .25s;}
  .desc-block.open .desc-chevron{transform:rotate(180deg);}
  .desc-body-outer{max-height:0;transition:max-height .35s ease;}
  .desc-block.open .desc-body-outer{max-height:600px;}
  .desc-body{padding:0 18px 16px;color:#4a4232;font-size:14.5px;}

  /* ABOUT */
  .about-card{
    background:var(--olive-deep);color:var(--paper);border-radius:var(--radius);
    max-width:640px;margin:0 auto;padding:30px 26px;text-align:center;
  }
  .about-card h2{color:var(--gold-light);font-size:26px;margin:0 0 10px;}
  .about-card p{font-size:14.5px;opacity:.92;}

  /* REVIEWS */
  .reviews-row{display:flex;gap:14px;overflow-x:auto;padding:6px 4px 14px;scroll-snap-type:x proximity;}
  .review-card{
    flex:0 0 auto;width:170px;background:var(--paper-card);border-radius:16px;overflow:hidden;
    scroll-snap-align:start;box-shadow:0 4px 10px rgba(44,54,32,.12);
  }
  .review-card img{width:100%;height:220px;object-fit:cover;display:block;background:#fff;}
  .review-card .cap{padding:10px 12px;font-size:12.5px;}
  .review-card .cap b{display:block;font-size:13px;color:var(--olive-deep);margin-bottom:2px;}
  .reviews-empty{text-align:center;color:var(--olive-soft);font-size:13.5px;}

  /* SOCIAL FOOTER */
  .social-row{display:flex;gap:12px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap;}
  .social-icon{
    width:38px;height:38px;border-radius:50%;background:var(--paper-card);
    display:flex;align-items:center;justify-content:center;color:var(--olive-deep);
    transition:.15s;
  }
  .social-icon:hover{background:var(--olive-deep);color:var(--paper);}
  .social-icon svg{width:18px;height:18px;fill:currentColor;}

  footer{padding:14px 20px 40px;text-align:center;font-size:12px;color:var(--olive-soft);}
  footer a.link-btn{text-decoration:underline;opacity:.75;}

  /* WHATSAPP FLOATING BUTTON */
  .wa-float{
    position:fixed;bottom:22px;left:22px;z-index:50;
    width:58px;height:58px;border-radius:50%;
    background:var(--whatsapp);color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.28);
  }
  .wa-float svg{width:30px;height:30px;fill:#fff;}
  .wa-float:hover{filter:brightness(1.06);}

  /* CART DRAWER */
  .overlay{position:fixed;inset:0;background:rgba(36,29,18,.45);z-index:60;display:none;}
  .overlay.show{display:block;}
  .drawer{
    position:fixed;top:0;bottom:0;left:0;width:min(380px,92vw);background:var(--paper);z-index:61;
    box-shadow:8px 0 30px rgba(0,0,0,.25);transform:translateX(-105%);transition:transform .25s ease;
    display:flex;flex-direction:column;
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .drawer-head h3{margin:0;font-size:20px;}
  .icon-btn{background:none;font-size:20px;color:var(--olive-deep);padding:4px 8px;}
  .drawer-body{flex:1;overflow-y:auto;padding:14px 20px;}
  .cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center;}
  .cart-item .thumb{width:52px;height:70px;background:var(--paper-card);border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .cart-item .thumb img{width:100%;height:100%;object-fit:contain;}
  .cart-item .meta{flex:1;font-size:14px;}
  .cart-item .meta b{display:block;}
  .qty-ctrl{display:flex;align-items:center;gap:8px;}
  .qty-ctrl button{background:var(--paper-card);width:24px;height:24px;border-radius:6px;font-weight:800;}
  .remove-link{font-size:12px;color:var(--danger);background:none;text-decoration:underline;padding:0;margin-top:4px;}
  .drawer-foot{padding:16px 20px;border-top:1px solid var(--line);}
  .total-row{display:flex;justify-content:space-between;font-weight:800;margin-bottom:12px;font-size:16px;}
  .empty-note{color:var(--olive-soft);text-align:center;padding:30px 10px;font-size:14px;}

  /* MODAL */
  .modal{
    position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px;
    background:rgba(36,29,18,.5);
  }
  .modal.show{display:flex;}
  .modal-card{
    background:var(--paper);border-radius:var(--radius);max-width:480px;width:100%;
    max-height:90vh;overflow-y:auto;padding:24px;
  }
  .modal-card h3{margin-top:0;font-size:22px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--olive-deep);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);
    background:#fbf9f1;font-size:14px;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .summary-box{background:var(--paper-card);border-radius:12px;padding:14px;font-size:13.5px;margin-bottom:16px;}
  .summary-box div{display:flex;justify-content:space-between;padding:3px 0;}
  .msg{font-size:13px;padding:10px 12px;border-radius:10px;margin-top:10px;}
  .msg.ok{background:#e4ecd7;color:var(--olive-deep);}
  .msg.info{background:#f1e6c9;color:#6b5320;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .pay-options{display:flex;flex-direction:column;gap:8px;}
  .pay-option{display:flex;align-items:center;gap:8px;background:#fbf9f1;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer;}
  .pay-option input{width:auto;}

  /* ADMIN */
  .admin-shell{padding:24px 16px 60px;max-width:760px;margin:0 auto;}
  .admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .tab{background:var(--paper-card);padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--olive-deep);}
  .tab.active{background:var(--olive-deep);color:var(--paper);}
  .panel{background:var(--paper-card);border-radius:18px;padding:22px;margin-bottom:18px;}
  .panel h3{margin-top:0;font-size:19px;}
  .size-admin-row{display:grid;grid-template-columns:74px 1fr 90px 90px;gap:10px;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line);}
  .upload-thumb{width:64px;height:84px;border-radius:8px;background:#fbf9f1;border:1px dashed var(--olive-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:10px;color:var(--olive-soft);text-align:center;}
  .upload-thumb img{width:100%;height:100%;object-fit:contain;}
  .file-btn{font-size:11px;background:#fbf9f1;border:1px solid var(--line);border-radius:6px;padding:5px 6px;display:block;margin-top:4px;width:100%;}
  .price-mini{font-size:10.5px;color:var(--olive-soft);display:block;margin-bottom:2px;}
  table.orders{width:100%;border-collapse:collapse;font-size:13px;}
  table.orders th,table.orders td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);}
  .status-select{padding:5px 6px;border-radius:6px;font-size:12px;border:1px solid var(--line);background:#fbf9f1;}
  .save-note{font-size:12px;color:var(--olive-soft);margin-top:8px;min-height:16px;}
  .link-btn{background:none;color:var(--olive-soft);text-decoration:underline;font-size:12.5px;}
  .kashier-note{background:#f1e6c9;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#6b5320;margin-top:10px;line-height:1.7;}
  .loading{text-align:center;padding:60px 20px;color:var(--olive-soft);}
  .block-admin{background:#fbf9f1;border-radius:12px;padding:14px;margin-bottom:12px;}
  .block-admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .del-btn{background:none;color:var(--danger);font-size:12.5px;text-decoration:underline;}
  .add-block-btn{background:var(--olive-deep);color:var(--paper);border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:700;margin-top:6px;}
</style>
</head>

    state.cart = ct ? JSON.parse(ct.value) : [];
  }catch(e){ state.cart = []; }

  state.selectedSize = state.config.sizes[0]?.key || null;
  if(state.config.descriptionBlocks?.[0]) state.blockOpen[state.config.descriptionBlocks[0].id] = true;
  render();
}

async function saveConfig(){
  try{ await window.storage.set(STORAGE_KEYS.config, JSON.stringify(state.config), true); }catch(e){}
}
async function saveOrders(){
  try{ await window.storage.set(STORAGE_KEYS.orders, JSON.stringify(state.orders), true); }catch(e){}
}
async function saveCart(){
  try{ await window.storage.set(STORAGE_KEYS.cart, JSON.stringify(state.cart), false); }catch(e){}
}

function fmt(n){ return Number(n).toLocaleString('ar-EG'); }
function esc(s){ return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function waDigits(s){ return (s||"").replace(/[^0-9]/g,''); }

function currentSize(){ return state.config.sizes.find(s=>s.key===state.selectedSize) || state.config.sizes[0]; }

function cartTotal(items){
  return items.reduce((sum,it)=>{
    const sz = state.config.sizes.find(s=>s.key===it.key);
    return sum + (sz? sz.price*it.qty : 0);
  },0);
}
function cartCount(){ return state.cart.reduce((n,it)=>n+it.qty,0); }

function addToCart(key, qty=1){
  const existing = state.cart.find(it=>it.key===key);
  if(existing){ existing.qty += qty; } else { state.cart.push({key,qty}); }
  saveCart();
  render();
}
function updateQty(key, delta){
  const it = state.cart.find(i=>i.key===key);
  if(!it) return;
  it.qty += delta;
  if(it.qty<=0) state.cart = state.cart.filter(i=>i.key!==key);
  saveCart();
  render();
}
function removeFromCart(key){
  state.cart = state.cart.filter(i=>i.key!==key);
  saveCart();
  render();
}

function openCheckout(items){
  state.checkoutItems = items;
  state.checkoutOpen = true;
  state.orderMsg = null;
  state.cartOpen = false;
  render();
}

async function submitOrder(e){
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim();
  const phone = f.phone.value.trim();
  const gov = f.gov.value;
  const address = f.address.value.trim();
  const notes = f.notes.value.trim();
  if(!name || !phone || !gov || !address){ return; }

  const paymentMethod = f.payment ? f.payment.value : "cod";
  const items = state.checkoutItems;
  const total = cartTotal(items);
  const order = {
    id: "ORD-" + Date.now().toString(36).toUpperCase(),
    createdAt: new Date().toISOString(),
    name, phone, governorate: gov, address, notes,
    items: items.map(it=>{
      const sz = state.config.sizes.find(s=>s.key===it.key);
      return { key: it.key, liter: sz?.liter, qty: it.qty, price: sz?.price };
    }),
    total,
    status: paymentMethod==="cod" ? "قيد التجهيز" : "بانتظار الدفع",
    paymentMethod
  };
  state.orders.unshift(order);
  await saveOrders();

  if(items === state.cart){
    state.cart = [];
    await saveCart();
  }

  if(paymentMethod === "cod"){
    state.orderMsg = {
      type:"ok",
      text: "تم تأكيد طلبك رقم " + order.id + " بنجاح. الدفع سيتم عند استلام الطلب."
    };
  } else {
    const mid = state.config.kashierMerchantId;
    const methodLabel = paymentMethod==="card" ? "بالبطاقة" : "بالمحفظة الإلكترونية";
    if(mid){
      state.orderMsg = {
        type:"info",
        text: "تم إنشاء طلبك رقم " + order.id + " للدفع " + methodLabel + ". لإتمام الدفع الفعلي عبر Kashier، الموقع يحتاج خادماً خلفياً يحسب بصمة التحقق (hash) بمفتاحك السري — لا يمكن حساب هذه البصمة بأمان من المتصفح مباشرة. بعد ربط الخادم سيُحوَّل العميل تلقائياً لصفحة الدفع."
      };
    } else {
      state.orderMsg = {
        type:"info",
        text: "تم إنشاء طلبك رقم " + order.id + ". لتفعيل الدفع الإلكتروني عبر Kashier أضف رقم المنشأة (Merchant ID) من لوحة التحكم."
      };
    }
  }
  render();
}

function bottleSVG(fillRatio, imgUrl){
  const fillHeight = 150 * fillRatio;
  const fillY = 190 - fillHeight;
  if(imgUrl){
    return `<img class="bottle-photo" src="${imgUrl}" alt="زجاجة المنتج">`;
  }
  return `
  <svg class="bottle-svg" viewBox="0 0 100 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="oilg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e6c877"/>
        <stop offset="100%" stop-color="#a97c22"/>
      </linearGradient>
      <clipPath id="bottleClip">
        <path d="M38,8 h24 v20 c0,6 10,10 10,26 v130 c0,14 -10,20 -22,20 h-0 c-12,0 -22,-6 -22,-20 v-130 c0,-16 10,-20 10,-26 z"/>
      </clipPath>
    </defs>
    <path d="M38,8 h24 v20 c0,6 10,10 10,26 v130 c0,14 -10,20 -22,20 h-0 c-12,0 -22,-6 -22,-20 v-130 c0,-16 10,-20 10,-26 z"
      fill="#f3efe0" stroke="#2c3620" stroke-width="2.2"/>
    <rect class="fill-mask" x="10" y="${fillY}" width="80" height="${fillHeight+10}" fill="url(#oilg)" clip-path="url(#bottleClip)"/>
    <rect x="42" y="0" width="16" height="10" rx="2" fill="#2c3620"/>
  </svg>`;
}

          <input type="number" data-size-price="${i}" value="${s.price}">
        </div>
      </div>
    `).join('')}
    <div class="field" style="max-width:160px;margin-top:6px;"><label>رمز العملة</label><input id="f-currency" value="${esc(cfg.currency)}"></div>
    <button class="btn btn-gold" id="saveSizes">حفظ</button>
    <div class="save-note">${esc(state.saveNote)}</div>
    <div class="kashier-note">اترك "السعر قبل" فارغاً أو صفراً إذا لم يكن هناك خصم. يفضّل رفع صور بخلفية مفرغة (PNG شفاف) وبجودة عالية ليظهر المنتج بوضوح.</div>
  </div>`;
}

function adminAbout(cfg){
  return `
  <div class="panel">
    <h3>قسم "من نحن"</h3>
    <div class="field"><label>العنوان</label><input id="f-aboutTitle" value="${esc(cfg.about.title)}"></div>
    <div class="field"><label>نص بسيط عن الشركة</label><textarea id="f-aboutText" style="min-height:100px;">${esc(cfg.about.text)}</textarea></div>
    <button class="btn btn-gold" id="saveAbout">حفظ</button>
    <div class="save-note">${esc(state.saveNote)}</div>
  </div>`;
}

function adminReviews(cfg){
  const reviews = cfg.reviews || [];
  return `
  <div class="panel">
    <h3>صور تقييمات وآراء العملاء</h3>
    ${reviews.length===0? '<p style="color:var(--olive-soft);font-size:13.5px;">لا توجد تقييمات مضافة بعد.</p>' : ''}
    ${reviews.map((r,i)=>`
      <div class="block-admin" data-review-row="${i}">
        <div style="display:flex;gap:12px;">
          <div class="upload-thumb" style="width:70px;height:90px;">
            ${r.image?`<img src="${r.image}">`:'صورة'}
            <input type="file" accept="image/*" class="file-btn" data-review-img="${i}">
          </div>
          <div style="flex:1;">
            <input data-review-name="${i}" value="${esc(r.name)}" placeholder="اسم العميل (اختياري)" style="width:100%;margin-bottom:6px;border:1px solid var(--line);border-radius:8px;padding:8px;">
            <input data-review-caption="${i}" value="${esc(r.caption)}" placeholder="تعليق مختصر (اختياري)" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;">
          </div>
        </div>
        <div class="block-admin-top" style="margin-top:8px;">
          <span></span>
          <button class="del-btn" data-del-review="${i}">حذف</button>
        </div>
      </div>
    `).join('')}
    <button class="add-block-btn" id="addReview">+ إضافة تقييم جديد</button>
    <div style="margin-top:12px;">
      <button class="btn btn-gold" id="saveReviews">حفظ التقييمات</button>
    </div>
    <div class="save-note">${esc(state.saveNote)}</div>
    <div class="kashier-note">ارفع صورة (سكرين شوت) لتعليق العميل، ويمكنك إضافة اسمه وتعليق مختصر اختيارياً. تظهر التقييمات في قسم "آراء عملائنا" أسفل صفحة المتجر.</div>
  </div>`;
}

function adminSocial(cfg){
  const s = cfg.social||{};
  return `
  <div class="panel">
    <h3>روابط التواصل الاجتماعي</h3>
    <div class="field"><label>رقم واتساب (مع كود الدولة، مثال: ٢٠١٠٠٠٠٠٠٠٠٠)</label><input id="f-wa" value="${esc(s.whatsapp)}" placeholder="201000000000"></div>
    <div class="field"><label>فيسبوك</label><input id="f-fb" value="${esc(s.facebook)}" placeholder="https://facebook.com/..."></div>
    <div class="field"><label>انستجرام</label><input id="f-ig" value="${esc(s.instagram)}" placeholder="https://instagram.com/..."></div>
    <div class="field"><label>تيك توك</label><input id="f-tt" value="${esc(s.tiktok)}" placeholder="https://tiktok.com/@..."></div>
    <div class="field"><label>تويتر / X</label><input id="f-tw" value="${esc(s.twitter)}" placeholder="https://x.com/..."></div>
    <div class="field"><label>يوتيوب</label><input id="f-yt" value="${esc(s.youtube)}" placeholder="https://youtube.com/..."></div>
    <button class="btn btn-gold" id="saveSocial">حفظ</button>
    <div class="save-note">${esc(state.saveNote)}</div>
    <div class="kashier-note">سيظهر زر واتساب عائم أسفل الصفحة تلقائياً بمجرد إضافة الرقم. باقي الروابط تظهر كأيقونات في أسفل الصفحة.</div>
  </div>`;
}

function adminPayment(cfg){
  const pm = cfg.paymentMethods || {cod:true,card:true,wallet:true};
  return `
  <div class="panel">
    <h3>طرق الدفع الظاهرة للعميل</h3>
    <label class="pay-option" style="margin-bottom:8px;"><input type="checkbox" id="pm-cod" ${pm.cod?'checked':''}><span>💵 الدفع عند الاستلام (كاش)</span></label>
    <label class="pay-option" style="margin-bottom:8px;"><input type="checkbox" id="pm-card" ${pm.card?'checked':''}><span>💳 بطاقة ائتمان / فيزا</span></label>
    <label class="pay-option" style="margin-bottom:8px;"><input type="checkbox" id="pm-wallet" ${pm.wallet?'checked':''}><span>📱 محفظة إلكترونية</span></label>
    <button class="btn btn-gold" id="saveMethods" style="margin-top:10px;">حفظ طرق الدفع</button>
    <div class="save-note">${esc(state.saveNote)}</div>
  </div>

  <div class="panel">
    <h3>إعدادات الدفع الإلكتروني — Kashier</h3>
    <div class="field"><label>رقم المنشأة (Merchant ID)</label><input id="f-mid" value="${esc(cfg.kashierMerchantId)}" placeholder="MID-xx-xx"></div>
    <div class="field"><label>وضع التشغيل</label>
      <select id="f-mode">
        <option value="test" ${cfg.kashierMode==='test'?'selected':''}>تجريبي (Test)</option>
        <option value="live" ${cfg.kashierMode==='live'?'selected':''}>مباشر (Live)</option>
      </select>
    </div>
    <button class="btn btn-gold" id="savePayment">حفظ</button>
    <div class="save-note">${esc(state.saveNote)}</div>
    <div class="kashier-note">
      يشمل ربط Kashier طريقتي "البطاقة" و"المحفظة الإلكترونية" معاً عبر نفس صفحة الدفع المستضافة. Kashier تتطلب حساب "بصمة" (hash) بتقنية HMAC-SHA256 باستخدام المفتاح السري لمنشأتك، وهذه العملية يجب أن تتم من خادم خلفي وليس من المتصفح حفاظاً على أمان المفتاح.
      لتفعيل الدفع الفعلي: أنشئ حساباً على kashier.io، وفعّل نقطة نهاية على خادمك تستقبل بيانات الطلب وتُرجع رابط الدفع الجاهز، ثم اربطها بهذه الصفحة. حالياً تُنشأ طلبات البطاقة/المحفظة وتُحفظ بحالة "بانتظار الدفع" لحين ربط الخادم، بينما تُؤكَّد طلبات الكاش مباشرة.
    </div>
  </div>`;
}

function adminOrders(){
  if(state.orders.length===0){
    return `<div class="panel"><h3>الطلبات</h3><p style="color:var(--olive-soft);">لا توجد طلبات بعد.</p></div>`;
  }
  return `
  <div class="panel">
    <h3>الطلبات</h3>
    <div style="overflow-x:auto;">
    <table class="orders">
      <thead><tr><th>الرقم</th><th>العميل</th><th>الهاتف</th><th>المحافظة</th><th>الأصناف</th><th>الإجمالي</th><th>الحالة</th></tr></thead>
      <tbody>
        ${state.orders.map((o,i)=>`
          <tr>
            <td>${esc(o.id)}</td>
            <td>${esc(o.name)}<br><span style="color:var(--olive-soft);font-size:11px;">${esc(o.address)}</span></td>
            <td>${esc(o.phone)}</td>
            <td>${esc(o.governorate)}</td>
            <td>${o.items.map(it=>`${esc(it.liter)}×${it.qty}`).join('، ')}</td>
            <td>${fmt(o.total)}</td>
            <td>
              <select class="status-select" data-order-status="${i}">
                ${["بانتظار الدفع","تم الدفع","قيد التجهيز","تم الشحن","ملغي"].map(st=>`<option ${o.status===st?'selected':''}>${st}</option>`).join('')}
              </select>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
    </div>
  </div>`;
}

// ---------- HANDLERS ----------
function attachHandlers(){
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);

  if(state.view==='store'){
    $('#openCart')?.addEventListener('click', ()=>{ state.cartOpen=true; render(); });
    $('#closeCart')?.addEventListener('click', ()=>{ state.cartOpen=false; render(); });
    $('#cartOverlay')?.addEventListener('click', ()=>{ state.cartOpen=false; render(); });
    $('#goAdmin')?.addEventListener('click', ()=>{ state.view='admin'; render(); });

    $$('.size-pill').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.selectedSize = btn.dataset.size; render(); });
    });
    $('#buyNow')?.addEventListener('click', ()=>{
      addToCart(state.selectedSize,1);
      openCheckout(state.cart);
    });
    $('#addCart')?.addEventListener('click', ()=>{ addToCart(state.selectedSize,1); });
    $('#checkoutCart')?.addEventListener('click', ()=>{ openCheckout(state.cart); });

    $$('[data-qty-plus]').forEach(b=>b.addEventListener('click', ()=>updateQty(b.dataset.qtyPlus,1)));
    $$('[data-qty-minus]').forEach(b=>b.addEventListener('click', ()=>updateQty(b.dataset.qtyMinus,-1)));
    $$('[data-remove]').forEach(b=>b.addEventListener('click', ()=>removeFromCart(b.dataset.remove)));

    $$('[data-toggle-block]').forEach(h=>{
      h.addEventListener('click', ()=>{
        const id = h.dataset.toggleBlock;
        state.blockOpen[id] = !state.blockOpen[id];
        render();
      });
    });

    $('#cancelCheckout')?.addEventListener('click', ()=>{ state.checkoutOpen=false; render(); });
    $('#closeCheckout')?.addEventListener('click', ()=>{ state.checkoutOpen=false; state.orderMsg=null; render(); });
    $('#orderForm')?.addEventListener('submit', submitOrder);
  } else {
    if(!state.adminAuthed){
      $('#backStore')?.addEventListener('click', ()=>{ state.view='store'; render(); });
      $('#adminLogin')?.addEventListener('submit', (e)=>{
        e.preventDefault();
        if(e.target.pw.value === state.config.adminPassword){ state.adminAuthed = true; }
        else { alert('كلمة المرور غير صحيحة'); }
        render();
      });
      return;
    }
    $('#backStore')?.addEventListener('click', ()=>{ state.view='store'; render(); });
    $$('.tab').forEach(t=>t.addEventListener('click', ()=>{ state.adminTab=t.dataset.tab; state.saveNote=''; render(); }));

    $('#saveIdentity')?.addEventListener('click', async ()=>{
      state.config.brandName = $('#f-brandName').value;
      state.config.tagline = $('#f-tagline').value;
      state.config.heroHeadline = $('#f-heroHeadline').value;
      state.config.heroText = $('#f-heroText').value;
      await saveConfig();
      state.saveNote = 'تم الحفظ ✓'; render();
    });
    $('#f-logo')?.addEventListener('change', (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = async ()=>{ state.config.logoImage = reader.result; await saveConfig(); render(); };
      reader.readAsDataURL(file);
    });

    $('#saveFacts')?.addEventListener('click', async ()=>{
      $$('[data-fact-value]').forEach(inp=>{ state.config.facts[inp.dataset.factValue].value = inp.value; });
      $$('[data-fact-label]').forEach(inp=>{ state.config.facts[inp.dataset.factLabel].label = inp.value; });
      await saveConfig();
      state.saveNote = 'تم الحفظ ✓'; render();
    });

    $('#addBlock')?.addEventListener('click', async ()=>{
      const id = 'b' + Date.now().toString(36);
      state.config.descriptionBlocks.push({id, title:'عنوان جديد', text:'اكتب النص هنا'});
      await saveConfig();
      render();
    });
    $$('[data-del-block]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        state.config.descriptionBlocks.splice(Number(b.dataset.delBlock),1);
        await saveConfig();
        render();
      });
    });
    $('#saveBlocks')?.addEventListener('click', async ()=>{
      $$('[data-block-title]').forEach(inp=>{ state.config.descriptionBlocks[inp.dataset.blockTitle].title = inp.value; });
      $$('[data-block-text]').forEach(inp=>{ state.config.descriptionBlocks[inp.dataset.blockText].text = inp.value; });
      await saveConfig();
      state.saveNote = 'تم الحفظ ✓'; render();
    });

    $$('[data-size-img]').forEach(inp=>{
      inp.addEventListener('change', (e)=>{
        const idx = inp.dataset.sizeImg; const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = async ()=>{ state.config.sizes[idx].image = reader.result; await saveConfig(); render(); };
        reader.readAsDataURL(file);
      });
    });
    $('#saveSizes')?.addEventListener('click', async ()=>{
      $$('[data-size-liter]').forEach(inp=>{ state.config.sizes[inp.dataset.sizeLiter].liter = inp.value; });
      $$('[data-size-price]').forEach(inp=>{ state.config.sizes[inp.dataset.sizePrice].price = Number(inp.value)||0; });
      $$('[data-size-original]').forEach(inp=>{ state.config.sizes[inp.dataset.sizeOriginal].originalPrice = Number(inp.value)||0; });
      state.config.currency = $('#f-currency').value;
      await saveConfig();
      state.saveNote = 'تم الحفظ ✓'; render();
    });

    $('#saveAbout')?.addEventListener('click', async ()=>{
      state.config.about.title = $('#f-aboutTitle').value;
      state.config.about.text = $('#f-aboutText').value;
      await saveConfig();
      state.saveNote = 'تم الحفظ ✓'; render();
    });

    if(!state.config.reviews) state.config.reviews = [];
    $('#addReview')?.addEventListener('click', async ()=>{
      state.config.reviews.push({id:'r'+Date.now().toString(36), image:"", name:"", caption:""});
      await saveConfig();
      render();
    });
    $$('[data-del-review]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        state.config.reviews.splice(Number(b.dataset.delReview),1);
        await saveConfig();
        render();
      });
    });
    $$('[data-review-img]').forEach(inp=>{
      inp.addEventListener('change', (e)=>{
        const idx = inp.dataset.reviewImg; const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = async ()=>{ state.config.reviews[idx].image = reader.result; await saveConfig(); render(); };
        reader.readAsDataURL(file);
      });
    });
    $('#saveReviews')?.addEventListener('click', async ()=>{
      $$('[data-review-name]').forEach(inp=>{ state.config.reviews[inp.dataset.reviewName].name = inp.value; });
      $$('[data-review-caption]').forEach(inp=>{ state.config.reviews[inp.dataset.reviewCaption].caption = inp.value; });
      await saveConfig();
      state.saveNote = 'تم الحفظ ✓'; render();
    });

    $('#saveSocial')?.addEventListener('click', async ()=>{
      state.config.social = {
        whatsapp: $('#f-wa').value.trim(),
        facebook: $('#f-fb').value.trim(),
        instagram: $('#f-ig').value.trim(),
        tiktok: $('#f-tt').value.trim(),
        twitter: $('#f-tw').value.trim(),
        youtube: $('#f-yt').value.trim()
      };
      await saveConfig();
      state.saveNote = 'تم الحفظ ✓'; render();
    });

    $('#savePayment')?.addEventListener('click', async ()=>{
      state.config.kashierMerchantId = $('#f-mid').value.trim();
      state.config.kashierMode = $('#f-mode').value;
      await saveConfig();
      state.saveNote = 'تم الحفظ ✓'; render();
    });

    $('#saveMethods')?.addEventListener('click', async ()=>{
      state.config.paymentMethods = {
        cod: $('#pm-cod').checked,
        card: $('#pm-card').checked,
        wallet: $('#pm-wallet').checked
      };
      await saveConfig();
      state.saveNote = 'تم الحفظ ✓'; render();
    });

    $$('[data-order-status]').forEach(sel=>{
      sel.addEventListener('change', async ()=>{
        state.orders[sel.dataset.orderStatus].status = sel.value;
        await saveOrders();
      });
    });
  }
}

loadAll();
</script>
</body>
</html>
